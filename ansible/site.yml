---
- name: Proxmox host and LXC guests
  hosts: proxmox
  become: true
  roles:
    - role: proxmox_host
      tags: [host]
    - role: nut_client
      tags: [nut]
    - role: postfix_relay
      tags: [postfix]
    - role: disk_alert
      tags: [diskalert]
    - role: lxc_guest
      tags: [lxc]

- name: Guest software
  hosts: guests:!native_guests
  tasks:
    - name: Wait for the guest to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 120
      tags: [always]

    - name: Docker
      ansible.builtin.include_role:
        name: docker_host
        apply:
          tags: [docker]
      tags: [docker]

    - name: Compose stacks
      ansible.builtin.include_role:
        name: compose_stack
        apply:
          tags: [stacks]
      tags: [stacks]
- name: Native guest software
  hosts: native_guests
  tasks:
    - name: Wait for the guest to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 120
      tags: [always]
    - name: PostgreSQL
      ansible.builtin.include_role:
        name: postgres_server
        apply:
          tags: [postgres]
      tags: [postgres]
