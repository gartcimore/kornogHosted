---
# --- Packages and Linux account -------------------------------------------
- name: Install host packages
  ansible.builtin.apt:
    name: "{{ proxmox_host_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Admin Linux user is in the sudo group
  ansible.builtin.user:
    name: "{{ proxmox_admin_linux_user }}"
    groups: sudo
    append: true

# --- SSH hardening ----------------------------------------------------------
- name: SSH hardening drop-in (key-only login)
  ansible.builtin.copy:
    src: 10-hardening.conf
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

# --- WireGuard for gluetun (arr guest) ------------------------------------------------
# A guest cannot load kernel modules, the host has to. Without this, gluetun only
# works after a manual `modprobe wireguard`.
- name: Load the WireGuard kernel module at boot
  ansible.builtin.copy:
    content: "wireguard\n"
    dest: /etc/modules-load.d/wireguard.conf
    owner: root
    group: root
    mode: "0644"
  notify: Load kernel modules

# --- Unprivileged guests that map UID/GID 1000 to the host's 1000 --------------------
- name: Allow root to map UID/GID 1000 into guests
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    line: "root:1000:1"
    regexp: '^root:1000:'
  loop:
    - /etc/subuid
    - /etc/subgid

# --- NAS mounts (tag mounts): NFS from ymir, SMB from drogo, guests start after them ----
# One block so `--tags mounts` applies the whole boot-order setup alone. Guide section 9.
- name: NAS mounts and boot order
  tags: [mounts]
  block:
    # --- NFS data share from Ymir ------------------------------------------------
    - name: Is the data share mounted
      ansible.builtin.command: findmnt --noheadings {{ nfs_data.path | quote }}
      register: proxmox_host_nfs_mounted
      changed_when: false
      failed_when: false
      check_mode: false

    # No mode/owner here: when mounted, this path is the NFS share root and its
    # permissions must not be touched.
    - name: Mount point exists  # noqa: risky-file-permissions
      ansible.builtin.file:
        path: "{{ nfs_data.path }}"
        state: directory

    # Immutable underneath the mount, so a missing mount makes writes fail instead
    # of filling the local disk. Only possible while the share is not mounted.
    - name: Mark the empty mount point immutable  # noqa: risky-file-permissions
      ansible.builtin.file:
        path: "{{ nfs_data.path }}"
        attributes: "+i"
      when: proxmox_host_nfs_mounted.rc != 0

    - name: Data share in fstab and mounted
      ansible.posix.mount:
        src: "{{ nfs_data.src }}"
        path: "{{ nfs_data.path }}"
        fstype: nfs
        opts: "{{ nfs_data.opts }}"
        state: mounted
      notify: Reload systemd

    # --- SMB shares (drogo) ------------------------------------------------------------
    - name: Read SMB credentials file status
      ansible.builtin.stat:
        path: "{{ item.credentials }}"
        get_checksum: false
        get_mime: false
      loop: "{{ cifs_mounts | default([]) }}"
      loop_control:
        label: "{{ item.credentials }}"
      register: proxmox_host_cifs_creds

    - name: SMB credentials file exists and is private
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == '0600'
          - item.stat.pw_name == 'root'
        fail_msg: >-
          {{ item.item.credentials }} must exist on {{ inventory_hostname }}, owned by root
          with mode 0600 (username= and password= lines). It is not stored in git.
      loop: "{{ proxmox_host_cifs_creds.results }}"
      loop_control:
        label: "{{ item.item.credentials }}"

    - name: Is each SMB share mounted
      ansible.builtin.command: findmnt --noheadings {{ item.path | quote }}
      loop: "{{ cifs_mounts | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      register: proxmox_host_cifs_mounted
      changed_when: false
      failed_when: false
      check_mode: false

    - name: SMB mount points exist  # noqa: risky-file-permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
      loop: "{{ cifs_mounts | default([]) }}"
      loop_control:
        label: "{{ item.path }}"

    # Read after the directory task, so a dry run (which does not create it) skips
    # the next step instead of failing on a missing path.
    - name: Read SMB mount point state
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ cifs_mounts | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      register: proxmox_host_cifs_dirs
      check_mode: false

    - name: Mark empty SMB mount points immutable  # noqa: risky-file-permissions
      ansible.builtin.file:
        path: "{{ item.item.path }}"
        attributes: "+i"
      loop: "{{ proxmox_host_cifs_mounted.results }}"
      loop_control:
        label: "{{ item.item.path }}"
        index_var: proxmox_host_idx
      when: item.rc != 0 and proxmox_host_cifs_dirs.results[proxmox_host_idx].stat.exists

    - name: SMB shares in fstab and mounted
      ansible.posix.mount:
        src: "{{ item.src }}"
        path: "{{ item.path }}"
        fstype: cifs
        opts: "credentials={{ item.credentials }},{{ item.opts }}"
        state: mounted
      loop: "{{ cifs_mounts | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      notify: Reload systemd
    - name: Remove the old guests-after-NFS drop-in (replaced by 10-nas-mounts.conf)
      ansible.builtin.file:
        path: /etc/systemd/system/pve-guests.service.d/10-nfs.conf
        state: absent
      notify: Reload systemd
    - name: NAS wait script
      ansible.builtin.template:
        src: nas-wait.j2
        dest: "{{ proxmox_host_nas_wait_script }}"
        owner: root
        group: root
        mode: "0750"
    - name: NAS wait unit (the mounts come after it)
      ansible.builtin.template:
        src: nas-wait.service.j2
        dest: /etc/systemd/system/nas-wait.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd
    - name: Guest start gate script (waits for the NAS mounts)
      ansible.builtin.template:
        src: pve-wait-mounts.j2
        dest: "{{ proxmox_host_mounts_gate_script }}"
        owner: root
        group: root
        mode: "0750"
    - name: Guests start after the NAS mounts, and only when they are all present
      ansible.builtin.template:
        src: 10-nas-mounts.conf.j2
        dest: /etc/systemd/system/pve-guests.service.d/10-nas-mounts.conf
        owner: root
        group: root
        mode: "0644"
        directory_mode: "0755"
      notify: Reload systemd

# --- Backups -------------------------------------------------------------------
- name: Set the vzdump temp directory on local disk
  ansible.builtin.lineinfile:
    path: /etc/vzdump.conf
    regexp: '^#?tmpdir:'
    line: "tmpdir: {{ proxmox_host_vzdump_tmpdir }}"

- name: Is the backup storage defined
  ansible.builtin.command: pvesm status --storage {{ backup_storage.id | quote }}
  register: proxmox_host_backup_storage_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Define the NFS backup storage
  ansible.builtin.command:
    argv:
      - pvesm
      - add
      - nfs
      - "{{ backup_storage.id }}"
      - --server
      - "{{ backup_storage.server }}"
      - --export
      - "{{ backup_storage.export }}"
      - --content
      - "{{ backup_storage.content }}"
  when: proxmox_host_backup_storage_status.rc != 0
  changed_when: true

- name: List backup jobs
  ansible.builtin.command: pvesh get /cluster/backup --output-format json
  register: proxmox_host_backup_jobs
  changed_when: false
  check_mode: false

- name: Create the nightly backup job
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - /cluster/backup
      - --id
      - "{{ backup_job.id }}"
      - --schedule
      - "{{ backup_job.schedule }}"
      - --storage
      - "{{ backup_storage.id }}"
      - --mode
      - "{{ backup_job.mode }}"
      - --compress
      - "{{ backup_job.compress }}"
      - --all
      - "1"
      - --enabled
      - "1"
      - --node
      - "{{ inventory_hostname }}"
      - --prune-backups
      - "{{ backup_job.prune }}"
  when: >-
    proxmox_host_backup_jobs.stdout | from_json
    | selectattr('storage', 'defined')
    | selectattr('storage', 'eq', backup_storage.id)
    | list | length == 0
  changed_when: true

# --- Proxmox web UI administrators ----------------------------------------------
- name: Read Proxmox groups
  ansible.builtin.command: pveum group list --output-format json
  register: proxmox_host_pve_groups_raw
  changed_when: false
  check_mode: false

- name: Read Proxmox users
  ansible.builtin.command: pveum user list --output-format json
  register: proxmox_host_pve_users_raw
  changed_when: false
  check_mode: false

- name: Read Proxmox ACLs
  ansible.builtin.command: pveum acl list --output-format json
  register: proxmox_host_pve_acl_raw
  changed_when: false
  check_mode: false

- name: Work out what is missing
  ansible.builtin.set_fact:
    proxmox_host_pve_group_missing: >-
      {{ proxmox_admin_group not in (proxmox_host_pve_groups_raw.stdout | from_json | map(attribute='groupid') | list) }}
    proxmox_host_pve_user_missing: >-
      {{ proxmox_admin_user not in (proxmox_host_pve_users_raw.stdout | from_json | map(attribute='userid') | list) }}
    proxmox_host_pve_user_in_group: >-
      {{ proxmox_admin_user in (
           (proxmox_host_pve_groups_raw.stdout | from_json
            | selectattr('groupid', 'eq', proxmox_admin_group)
            | map(attribute='users', default='') | list | first | default(''))
           .split(',')) }}
    proxmox_host_pve_acl_missing: >-
      {{ (proxmox_host_pve_acl_raw.stdout | from_json
          | selectattr('path', 'eq', '/')
          | selectattr('type', 'eq', 'group')
          | selectattr('ugid', 'eq', proxmox_admin_group)
          | selectattr('roleid', 'eq', proxmox_admin_role)
          | list | length) == 0 }}

- name: Create the admin group
  ansible.builtin.command: pveum group add {{ proxmox_admin_group | quote }} --comment "Proxmox administrators"
  when: proxmox_host_pve_group_missing | bool
  changed_when: true

- name: Grant the admin role to the group
  ansible.builtin.command: pveum acl modify / --groups {{ proxmox_admin_group | quote }} --roles {{ proxmox_admin_role | quote }}
  when: proxmox_host_pve_acl_missing | bool
  changed_when: true

- name: Create the web UI user
  ansible.builtin.command: pveum user add {{ proxmox_admin_user | quote }} --groups {{ proxmox_admin_group | quote }}
  when: proxmox_host_pve_user_missing | bool
  changed_when: true

- name: Put the existing web UI user in the admin group
  ansible.builtin.command: pveum user modify {{ proxmox_admin_user | quote }} --groups {{ proxmox_admin_group | quote }}
  when: not (proxmox_host_pve_user_missing | bool) and not (proxmox_host_pve_user_in_group | bool)
  changed_when: true
