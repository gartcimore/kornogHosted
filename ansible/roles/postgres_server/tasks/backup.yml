---
- name: Backup script
  ansible.builtin.template:
    src: pg-backup.j2
    dest: "{{ postgres_server_sbin }}/pg-backup"
    owner: root
    group: root
    mode: "0750"
- name: Backup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - postgres-backup.service
    - postgres-backup.timer
  notify: Daemon reload
- name: Apply unit changes now
  ansible.builtin.meta: flush_handlers
- name: The backup timer is enabled
  ansible.builtin.systemd_service:
    name: postgres-backup.timer
    enabled: true
    state: started
- name: The timers pick up a changed time zone
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - postgres-backup.timer
    - pg-tls-sync.timer
  when: postgres_server_tz_link is changed or postgres_server_tz_name is changed
