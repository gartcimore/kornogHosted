---
- name: Daemon reload
  ansible.builtin.systemd_service:
    daemon_reload: true
- name: Restart PostgreSQL
  ansible.builtin.systemd_service:
    name: "postgresql@{{ postgres_server_version }}-main"
    state: restarted
- name: Reload PostgreSQL
  ansible.builtin.command: pg_ctlcluster {{ postgres_server_version | quote }} main reload
  changed_when: true
