---
- name: Base packages
  ansible.builtin.apt:
    name: "{{ docker_host_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Time zone
  ansible.builtin.file:
    src: "../usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: "{{ docker_host_keyring }}"
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    signed_by: "{{ docker_host_keyring }}"
    state: present
  register: docker_host_repo

# Not a handler: the cache must be fresh before the install task below.
- name: Refresh apt after a repository change  # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
  when: docker_host_repo is changed

- name: Docker engine and compose plugin
  ansible.builtin.apt:
    name: "{{ docker_host_packages }}"
    state: present

- name: Docker is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
