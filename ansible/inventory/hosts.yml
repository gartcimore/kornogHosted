---
# Hosts and groups only. Per-host settings live in host_vars/, shared settings
# in group_vars/. Addresses are tracked in docs/ip-inventory.md.
all:
  children:
    proxmox:
      hosts:
        orisa:
          ansible_host: 192.168.0.12
          ansible_user: gart
    # LXC guests created on orisa. Each guest's definition (VMID, IP, size,
    # mounts) is in host_vars/<name>.yml under the `lxc` key, and
    # ansible_host is derived from it.
    guests:
      hosts:
        rproxy:
        jellyfin:
        arr:
        db:
      vars:
        ansible_user: root
    # Guests that get native services and no Docker (see the second play in
    # site.yml). They must also be listed under `guests` so lxc_guest creates them.
    native_guests:
      hosts:
        db:
