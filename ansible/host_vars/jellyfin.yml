---
# Guest definition, read by the lxc_guest role on orisa. It is applied only
# when the guest is created. Changing it later does not modify a running guest.
lxc:
  vmid: 122
  ip: 192.168.0.22
  cores: 4
  memory: 4096
  swap: 512
  disk_gb: 16
  startup_order: 2
  pct_options:
    # Media from Ymir, read-only. World-readable, so no id-map is needed.
    mp0: /mnt/dataYmir/media,mp=/mnt/dataYmir/media,ro=1
    # Media from drogo (SMB on the host, mapped to the guest's UID 1000), read-only.
    mp1: /mnt/dataDrogo/media,mp=/mnt/dataDrogo/media,ro=1
    # iGPU render node. The gid is the group owning the node inside the guest.
    # It must be the gid Jellyfin's ffmpeg runs with: the linuxserver image runs
    # it as `abc` (PUID/PGID 1000) and does not add it to the `render` group, so
    # gid=993 (the host's render group) gives "Failed to open the given device".
    dev0: /dev/dri/renderD128,gid=1000

ansible_host: "{{ lxc.ip }}"

compose_stacks:
  - name: jellyfin
    src: "{{ playbook_dir }}/../jellyfin"
