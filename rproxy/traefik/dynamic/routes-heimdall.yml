# Temporary routes to the services still running on heimdall (192.168.0.20).
# They let us test rproxy before any DNS record moves:
#   curl --resolve radarr.kornoglab.fr:443:192.168.0.21 https://radarr.kornoglab.fr/
# When a service moves to its new guest, move its route to its own routes-<name>.yml
# and point it at that guest's IP. The file provider does not expand variables,
# so the domain is written out.

http:
  routers:
    radarr:
      rule: Host(`radarr.kornoglab.fr`)
      entryPoints: [websecure]
      tls: {}
      service: radarr

  services:
    radarr:
      loadBalancer:
        servers:
          - url: http://192.168.0.20:7878
