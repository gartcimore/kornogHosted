services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy-kornoglab
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ${CERTS_DIR}:/etc/nginx/certs:ro
    env_file:
      - .env
    mem_limit: 64m
